<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroScan AI Dashboard</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .dashboard-container {
            background-color: #1c2541;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 1000px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #00b4d8;
            margin: 0 0 5px 0;
            font-size: 2.2rem;
        }
        .header p {
            color: #6c757d;
            margin: 0;
            font-size: 1rem;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }
        .panel {
            background-color: #0b132b;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #3a506b;
        }
        .panel-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #e0e1dd;
        }
        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #00b4d8;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirrors the webcam for a natural layout look */
        }
        .camera-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            font-family: monospace;
            color: #00b4d8;
            font-size: 0.85rem;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }
        .scanning-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00b4d8, transparent);
            top: 50%;
            box-shadow: 0 0 8px #00b4d8;
            animation: scan 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-clear { background-color: #00b4d8; color: #0b132b; }
        .btn-leak { background-color: #e63946; color: #fff; }
        
        .analysis-row { margin-bottom: 20px; }
        .analysis-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .progress-bar-bg {
            background-color: #1c2541;
            border-radius: 4px;
            height: 12px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #00b4d8;
            border-radius: 4px;
        }
        .status-box {
            text-align: center;
            background-color: rgba(0, 180, 216, 0.1);
            border: 1px solid #00b4d8;
            padding: 15px;
            border-radius: 6px;
            color: #00b4d8;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 25px;
        }
        .note {
            font-size: 0.85rem;
            color: #e63946;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>AeroScan AI Dashboard</h1>
        <p>Live Camera Edge Vision Model Interface</p>
    </div>

    <div class="main-content">
        <!-- LEFT SIDE: CAMERA -->
        <div>
            <div class="panel">
                <h3 class="panel-title">Live Drone Camera Feed</h3>
                <div class="camera-box">
                    <div class="camera-overlay">CAM-01 // HARDWARE_LIVE</div>
                    <div class="scanning-line"></div>
                    <!-- Added the missing Video element so the browser can actually run the stream -->
                    <video id="webcam" autoplay playsinline muted></video>
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-clear">AI Trigger: Clear Pipeline</button>
                <button class="btn btn-leak">AI Trigger: Leak Anomaly</button>
            </div>
        </div>

        <!-- RIGHT SIDE: REAL-TIME ANALYSIS -->
        <div class="panel">
            <h3 class="panel-title">AI Real-Time Analysis</h3>
            
            <div class="analysis-row">
                <div class="analysis-label">
                    <span>Class: Secure_Operations</span>
                    <span>100%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 100%;"></div>
                </div>
            </div>

            <div class="analysis-row">
                <div class="analysis-label">
                    <span>Class: Leak_Anomaly_Detected</span>
                    <span>0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 0%; background-color: #e63946;"></div>
                </div>
            </div>

            <div class="status-box">
                SYSTEM STATUS: SECURE
            </div>

            <p class="note">⚠ Note: Accept the browser camera prompt to view your physical model live!</p>
        </div>
    </div>
</div>

<script>
    // Automatically trigger webcam request upon page loading
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            const videoElement = document.getElementById('webcam');
            if (videoElement) {
                videoElement.srcObject = stream;
            }
        } catch (err) {
            console.error("Camera prompt blocked, denied, or not found: ", err);
            alert("Could not open camera feed. Please check your browser privacy settings or address bar permissions!");
        }
    }

    // Initialize stream immediately
    window.addEventListener('DOMContentLoaded', initCamera);
</script>

</body>
</html>
